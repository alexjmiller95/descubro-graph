<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descubro — Artist Mind Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #fafafa; }
    text { font-family: sans-serif; font-size: 11px; pointer-events: none; fill: #333; }
    circle { stroke: #fff; stroke-width: 1px; cursor: pointer; }
    line { stroke-opacity: 0.6; }
  </style>
</head>
<body>
<script>
console.log("✅ Script loaded — starting Descubro visualization...");

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("body").append("svg")
  .attr("width", width)
  .attr("height", height);

// ✅ Bubble API endpoints (test mode)
const artistAPI = "https://alexjmiller95.bubbleapps.io/version-test/api/1.1/obj/Artist";
const connectionAPI = "https://alexjmiller95.bubbleapps.io/version-test/api/1.1/obj/ArtistConnection?limit=500";

console.log("🔍 Fetching from:", artistAPI, "and", connectionAPI);

// 🧠 Fetch both datasets
Promise.all([
  fetch(artistAPI).then(res => res.json()),
  fetch(connectionAPI).then(res => res.json())
])
.then(([artistData, connectionData]) => {
  console.log("🎨 Artists data received:", artistData);
  console.log("🔗 Connections data received:", connectionData);

  const artists = artistData?.response?.results || [];
  const connections = connectionData?.response?.results || [];

  if (!artists.length) {
    console.warn("⚠️ No artist data found.");
    return;
  }
  if (!connections.length) {
    console.warn("⚠️ No connection data found.");
  }

  // 🎨 Color scale by genre
  const allGenres = Array.from(new Set(artists.map(a => a.genre || "Unknown")));
  const color = d3.scaleOrdinal(d3.schemeSet2).domain(allGenres);

  // 🧩 Create nodes
  const nodes = artists.map(a => ({
    id: a._id,
    name: a.name || "Unknown",
    genre: a.genre || "Other",
    image: a.image_url || null,
    connections: a.connections || []
  }));

  // 🔗 Build links
  let links = connections
    .filter(c => c.artist_1 && c.artist_2)
    .map(c => ({
      source: typeof c.artist_1 === "object" ? c.artist_1._id : c.artist_1,
      target: typeof c.artist_2 === "object" ? c.artist_2._id : c.artist_2,
      genre: c.genre || "Other",
      strength: c.connection_strength || 1
    }));

  // Also use connections array inside artists
  nodes.forEach(a => {
    if (Array.isArray(a.connections)) {
      a.connections.forEach(connId => {
        links.push({
          source: a.id,
          target: connId,
          genre: a.genre,
          strength: 1
        });
      });
    }
  });

  // Remove duplicates
  links = Array.from(new Map(links.map(l => [l.source + "-" + l.target, l])).values());

  console.log("🧩 Nodes:", nodes.length, " Links:", links.length);

  // 🧠 D3 Simulation
  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(150))
    .force("charge", d3.forceManyBody().strength(-200))
    .force("center", d3.forceCenter(width / 2, height / 2));

  const link = svg.append("g")
    .selectAll("line")
    .data(links)
    .join("line")
    .attr("stroke", d => color(d.genre))
    .attr("stroke-width", d => Math.max(1, d.strength * 3));

  const node = svg.append("g")
    .selectAll("circle")
    .data(nodes)
    .join("circle")
    .attr("r", 6)
    .attr("fill", d => color(d.genre))
    .call(drag(simulation))
    .on("mouseover", (event, d) => showTooltip(event, d))
    .on("mouseout", hideTooltip);

  const label = svg.append("g")
    .selectAll("text")
    .data(nodes)
    .join("text")
    .text(d => d.name)
    .attr("x", 8)
    .attr("y", 4);

  const tooltip = d3.select("body").append("div")
    .style("position", "absolute")
    .style("background", "#fff")
    .style("padding", "6px 8px")
    .style("border", "1px solid #ddd")
    .style("border-radius", "4px")
    .style("pointer-events", "none")
    .style("opacity", 0)
    .style("font-size", "12px");

  function showTooltip(event, d) {
    tooltip.transition().duration(200).style("opacity", 1);
    tooltip.html(`<strong>${d.name}</strong><br>${d.genre}`)
      .style("left", (event.pageX + 10) + "px")
      .style("top", (event.pageY - 20) + "px");
  }

  function hideTooltip() {
    tooltip.transition().duration(200).style("opacity", 0);
  }

  simulation.on("tick", () => {
    link
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x)
      .attr("y2", d => d.target.y);

    node
      .attr("cx", d => d.x)
      .attr("cy", d => d.y);

    label
      .attr("x", d => d.x + 8)
      .attr("y", d => d.y + 4);
  });

  function drag(simulation) {
    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }
    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }
    return d3.drag()
      .on("start", dragstarted)
      .on("drag", dragged)
      .on("end", dragended);
  }
})
.catch(err => console.error("🚨 Fetch or visualization error:", err));
</script>
</body>
</html>
